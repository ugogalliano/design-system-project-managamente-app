name: Version

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compute next version
        id: next-version
        run: |
          pnpm exec changeset status --output=status.json || true
          VERSION=$(node -p "require('./status.json').releases?.[0]?.newVersion ?? ''" 2>/dev/null || true)
          if [ -n "$VERSION" ]; then
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - uses: changesets/action@v1
        with:
          commit: '[Release] Version Packages ${{ steps.next-version.outputs.tag }}'
          title: '[Release] Version Packages ${{ steps.next-version.outputs.tag }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
